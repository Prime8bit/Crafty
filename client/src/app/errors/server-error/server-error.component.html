<h4>Internal Server Error</h4>
@if (error) {
    <h5 class="text-danger">Error: {{error.message}}</h5>
    <!-- I would use a more PR friendly message in production -->
    <p class="font-weight-bold">Contact the server administrator with the following data.</p>
    <p class="font-weight-bold">Details:</p>
    <code id="codeBox" class="mt-5">
        {{error.details}}
    </code>
}
