<nav class="navbar navbar-expand-md navbar-dark fixed-top bg-primary">
    <div class="container-fluid">
        <a class="navbar-brand" routerLink="/"><img id="navLogo" src="assets/Logo.png"/></a>
        <ul class="navbar-nav me-auto mb-2 mb-md-0">  
            <li class="nav-item">
                <a class="nav-link" routerLinkActive="active" routerLink="/craft">Crafts</a>
            </li>  
            @if(accountService.currentUser()) {
                <li class="nav-item">
                    <a class="nav-link" routerLinkActive="active" routerLink="/user/update" [queryParams]="{tab: 'Wishlist'}">Wishlist</a>
                </li>     
                <li class="nav-item">
                    <a class="nav-link" routerLinkActive="active" routerLink="/chat">Chat</a>
                </li>        
                <!-- TODO (Nate): Even though the course author uses this, it is not a great solution. If the appHasRole directive
                 * is used outside an if statement like this, it will only work when you force a refresh of the tag somehow. If the course author
                 * doesn't fix this later in the course, then I should. -->   
                <li *appHasRole="['Admin']" class="nav-item">
                    <a class="nav-link" routerLinkActive="active" routerLink="/inappropriate-craft-list">Inappropriate Crafts</a>
                </li>
            }
        </ul>
        @if(accountService.currentUser()) {
            <div dropdown class="dropdown">
                <a dropdownToggle class="dropdown-toggle text-light text-decoration-none">
                    Welcome {{accountService.currentUser()?.userDisplayName | titlecase}}
                </a>
                <div *dropdownMenu class="dropdown-menu">
                    <a class="dropdown-item" routerLink="/user/update">Update Profile</a>
                    <div class="dropdown-divider"></div>
                    <a class="dropdown-item" routerLink="/cart">Cart ({{orderService.cartCount()}})</a>
                    <div class="dropdown-divider"></div>
                    <a class="dropdown-item" routerLink="/user/update" [queryParams]="{tab: 'Wishlist'}">Wishlist</a>
                    <div class="dropdown-divider"></div>
                    <a class="dropdown-item" routerLink="/user/update" [queryParams]="{tab: 'Orders'}">Orders</a>
                    <div class="dropdown-divider"></div>
                    <a class="dropdown-item" (click)="logout()">Logout</a>
                </div>  
            </div>
        } @else {
            <form #loginForm="ngForm" (ngSubmit)="login()" class="d-flex" autocomplete="off">
                <input name="userName" 
                [(ngModel)]="model.userName" 
                class="form-control me-2"
                type="text" 
                placeholder="Username" 
                aria-label="Username">
                <input name = "password"
                [(ngModel)]="model.password"
                class="form-control me-2" 
                type="password" 
                placeholder="Password" 
                aria-label="Password">
                <button class="btn btn-success" type="submit">Login</button>
            </form>
        }
    </div>
</nav>
