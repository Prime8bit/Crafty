<div class="card mb-4">
    <div class="card-img-wrapper d-flex justify-content-center align-items-center">
        <img class="card-img-top" src="{{craft().searchImage?.url || ''}}" alt="{{craft().name}}">
        <ul class="list-inline craft-icons animate text-center">
            <li class="list-inline-item">
                <button routerLink="/craft/{{craft().id}}" class="btn btn-primary"><i class="fa fa-info-circle"></i></button>
            </li>
            @if (craft().sellerUserName === accountService.currentUser()?.userName) {
                <li class="list-inline-item">
                    <button routerLink="/craft/{{craft().id}}/update" class="btn btn-primary"><i class="fa fa-pencil-square-o"></i></button>
                </li>
                <li class="list-inline-item">
                    <button 
                        class="btn btn-danger"
                        [disabled]="craft().isArchived"
                        (click)="archiveCraft()" 
                        ><i class="fa fa-trash"></i></button>
                </li>
            } @else {
                <li class="list-inline-item">
                    <button 
                        class="btn btn-primary"
                        (click)="toggleWishlist()"
                        ><i class="fa fa-heart"></i></button>
                </li>
                <li class="list-inline-item">
                    <button class="btn btn-primary"><i class="fa fa-envelope"></i></button>
                </li>
            }
        </ul>
    </div>
    <div class="card-body p-1">
        <h5 class="card-title text-center mb-3">
            <i class="fa fa-gift me-2"></i>
            {{craft().name}}
            @if(isWishlisted()) {
                <i class="fa fa-heart ms-2" style="color: red"></i>
            }
        </h5>
        <div class="d-flex justify-content-center align-items-center">
            <p class="card-text text-muted mb-0 ms-2 me-auto">${{craft().price | number:'1.2-2'}}</p>
            @if (craft().sellerUserName === accountService.currentUser()?.userName) {
                <button class="btn btn-primary d-flex align-items-center">
                    <i class="fa fa-cart-plus me-2"></i>
                    <p class="mb-0">View Orders</p>
                </button>
            } @else {
                <button class="btn btn-primary d-flex align-items-center"> 
                    <i class="fa fa-cart-plus me-2"></i>
                    <p class="mb-0">Add to cart</p>
                </button>
            }
        </div>
    </div>
</div>
