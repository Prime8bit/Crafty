@if (user) {
    <div class="row">
        <div class="col-4">
            <div class="card">
                <div class="d-flex flex-column justify-content-center align-items-center">
                    <img class="card-image" src="{{user.profileImage.url}}" alt="Photo of {{user.displayName}}">
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col text-nowrap">
                            <p><strong>Name: </strong>{{user.displayName}}</p>
                            <p><strong>Member since: </strong>{{user.created}}</p>
                        </div>
                    </div>
                    <div class="card-footer d-flex justify-content-center">
                        <a 
                            [routerLink] = "['/chat']" 
                            [queryParams] = "{ selectedUser: user.id }"
                            class="btn btn-primary"
                            >Message Crafter</a>
                    </div>
                </div>
            </div>
        </div>
        <!-- Bootstrap uses a 12 column grid so use the remaining space. -->
        <div class="col-8">
            <div class="row">
                @for (craft of user.products; track craft.id) {
                    <div class="col-3">
                        <app-craft-card [craft]="craft"></app-craft-card>
                    </div>
                }
            </div>
        </div>
        <!-- FUTURE (Nate): If I want to improve this, I would add reviews here, but that increases the complexity of this project significantly. -->
    </div>
}
