services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: crafty-frontend
    ports:
      - "4200:4200"
    restart: unless-stopped
  
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: crafty-backend
    ports:
      - "5000:5000"
    restart: unless-stopped